packages:
  - "packages/*"
  - "apps/*"

# React Native's toolchain relies on a flat node_modules: Metro and the many
# implicit peer dependencies in the RN ecosystem do not cope with pnpm's default
# isolated layout.
nodeLinker: hoisted

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.25'
  - '@expo/router-server@57.0.10'
  - babel-preset-expo@57.0.12
  - expo@57.0.23
